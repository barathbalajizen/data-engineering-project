project:
  name: ecommerce-pipeline
  version: 0.1.0
  environment: development

# Data Lake Configuration
data_lake:
  provider: ${STORAGE_PROVIDER}
  local_path: ${LOCAL_DATA_LAKE_PATH}
  file_format: ${LOCAL_STORAGE_FORMAT}
  account_name: ${AZURE_STORAGE_ACCOUNT_NAME}
  connection_string: ${AZURE_STORAGE_CONNECTION_STRING}
  containers:
    bronze: bronze
    silver: silver
    gold: gold
  partitioning:
    pattern: "{layer}/{source}/date={date}"

# Data Sources Configuration
sources:
  orders:
    type: csv
    location: ${ORDERS_CSV_PATH}
    schema:
      - order_id: string
      - customer_id: string
      - order_date: datetime
      - total_price: float
      - state: string

  products:
    type: rest_api
    base_url: ${DUMMYJSON_BASE_URL}
    endpoint: /products
    timeout: ${API_TIMEOUT}
    retries: ${API_RETRIES}
    schema:
      - product_id: integer
      - title: string
      - price: float
      - category: string
      - stock: integer

  reviews:
    type: csv
    location: ${REVIEWS_CSV_PATH}
    schema:
      - review_id: string
      - order_id: string
      - product_id: string
      - review_comment: string
      - review_creation_date: datetime

# Database Configuration
database:
  type: postgres
  host: ${DB_HOST}
  port: ${DB_PORT}
  database: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  pool_size: 10
  echo: false  # Set to true for SQL logging

# Data Quality Checks
quality:
  enabled: true
  fail_on_error: false  # If true, pipeline stops on validation errors
  checks:
    - column_nullability
    - data_types
    - range_validation
    - deduplication

# Orchestration (Prefect)
orchestration:
  type: prefect
  schedule: "0 2 * * *"  # Daily at 2 AM UTC
  retries: 3
  retry_delay_seconds: 60

# Logging
logging:
  level: ${LOG_LEVEL}
  format: json
  output_dir: ${LOG_DIR}
  retention_days: 30

# Feature Flags
features:
  sentiment_analysis: true
  keyword_extraction: true
  upsert_to_sql: true
