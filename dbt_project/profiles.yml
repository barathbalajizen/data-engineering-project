ecommerce:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'postgres') }}"
      port: "{{ env_var('PG_PORT', '5432') | as_number }}"
      user: "{{ env_var('PG_USER', 'de') }}"
      password: "{{ env_var('PG_PASSWORD', 'de') }}"
      dbname: "{{ env_var('PG_DB', 'shop') }}"
      schema: analytics
      threads: 2
