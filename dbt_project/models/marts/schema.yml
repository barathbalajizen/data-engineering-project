version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: is_current
        data_tests: [not_null]
  - name: dim_product
    columns:
      - name: product_key
        data_tests: [unique, not_null]
  - name: dim_seller
    columns:
      - name: seller_key
        data_tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]
  - name: fact_orders
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: price
        data_tests: [not_null, non_negative]
      - name: is_late
        data_tests:
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        data_tests:
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: seller_key
        data_tests:
          - relationships:
              to: ref('dim_seller')
              field: seller_key
      - name: order_status
        data_tests:
          - accepted_values:
              values: [created, approved, invoiced, processing, shipped, delivered, unavailable, canceled]
  - name: fact_payments
    columns:
      - name: payment_key
        data_tests: [unique, not_null]
      - name: date_key
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: payment_type
        data_tests:
          - accepted_values:
              values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value
        data_tests: [non_negative]
  - name: agg_monthly_kpis
    columns:
      - name: month
        data_tests: [unique, not_null]
      - name: avg_order_value
        data_tests: [not_null, non_negative]
      - name: new_customers
        data_tests: [non_negative]
  - name: agg_customer_retention
    data_tests:
      - unique_combination:
          columns: [cohort_month, months_since_first]
    columns:
      - name: months_since_first
        data_tests: [not_null, non_negative]
      - name: retention_pct
        data_tests: [not_null, non_negative]
  - name: agg_product_sales
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: revenue
        data_tests: [non_negative]
