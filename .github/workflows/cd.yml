name: CD - Deploy to Azure Container Registry

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Push to ACR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR login credentials
        run: |
          ACR_NAME=${{ secrets.ACR_REGISTRY_NAME }}
          az acr login --name $ACR_NAME

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY_URL }}/ecommerce-pipeline:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY_URL }}/ecommerce-pipeline:latest
            ${{ secrets.ACR_REGISTRY_URL }}/ecommerce-pipeline:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ secrets.ACR_REGISTRY_URL }}/ecommerce-pipeline:buildcache
          cache-to: type=registry,ref=${{ secrets.ACR_REGISTRY_URL }}/ecommerce-pipeline:buildcache,mode=max

      - name: Logout from Azure
        run: az logout

  test-deployment:
    runs-on: ubuntu-latest
    name: Test Deployed Image
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pull and test Docker image
        run: |
          ACR_URL=${{ secrets.ACR_REGISTRY_URL }}
          docker pull $ACR_URL/ecommerce-pipeline:latest
          docker run --rm $ACR_URL/ecommerce-pipeline:latest --help || true

      - name: Logout from Azure
        run: az logout

  notify:
    runs-on: ubuntu-latest
    name: Send Deployment Notification
    needs: test-deployment
    if: always()

    steps:
      - name: Send Slack Notification
        if: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Deployment Status",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "E-Commerce Pipeline Deployment\nStatus: ${{ needs.test-deployment.result }}\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
