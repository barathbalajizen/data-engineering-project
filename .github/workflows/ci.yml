name: ci
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyspark==3.5.1 pytest==8.2.2
      - run: pytest tests -q

  # Validates the dbt project with the same pinned dbt as the Docker image (no database needed for parse)
  dbt-parse:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dbt.txt
      - run: dbt --version
      - run: dbt parse --project-dir dbt_project
