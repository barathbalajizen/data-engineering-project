[project]
name = "ecommerce-pipeline"
version = "0.1.0"
description = "E-commerce medallion data pipeline with Prefect orchestration"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
	"pandas==2.1.3",
	"polars==0.19.12",
	"numpy==1.24.3",
	"azure-storage-blob==12.18.3",
	"azure-identity==1.14.0",
	"deltalake==0.14.0",
	"requests==2.31.0",
	"tenacity==8.2.3",
	"pandera==0.18.0",
	"textblob==0.17.1",
	"vaderSentiment==3.3.2",
	"psycopg2-binary==2.9.9",
	"sqlalchemy==2.0.23",
	"alembic==1.12.1",
	"prefect==2.14.1",
	"prefect-azure==0.2.0",
	"griffe==0.38.0",
	"streamlit==1.28.1",
	"plotly==5.17.0",
	"python-dotenv==1.0.0",
	"pyyaml==6.0.1",
	"python-json-logger==2.0.7",
	"python-dateutil==2.8.2",
	"pytz==2023.3",
]

[project.optional-dependencies]
dev = [
	"pytest==7.4.3",
	"pytest-cov==4.1.0",
	"pytest-asyncio==0.21.1",
	"moto==4.2.9",
	"black==23.11.0",
	"flake8==6.1.0",
	"mypy==1.7.1",
	"isort==5.13.2",
	"ipython==8.17.2",
	"jupyter==1.0.0",
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
