# Prefect Deployment Configuration
# This file defines how to deploy the ecommerce pipeline flow

# Define flows in this project
flows:
  ecommerce-pipeline:
    entrypoint: src/flows/prefect_flow.py:ecommerce_pipeline_flow
    parameters: {}

# Define deployments
deployments:
  - name: ecommerce-daily
    description: "E-Commerce Data Pipeline - Daily Execution"
    version: "1.0"
    flow_name: ecommerce-pipeline
    schedule:
      cron: "0 2 * * *"  # 2:00 AM daily
      timezone: "UTC"
    parameters:
      run_date: null
    tags:
      - production
      - daily
      - ecommerce
    work_pool:
      name: default
